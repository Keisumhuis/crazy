# sample config for parser tests
default_timeout = 10
cache_size = 256

[database]
host = 127.0.0.1
port = 3306
username = admin
password = "<redacted>"
database = test_db
max_connections = 100
timeout = 30.5
ssl_enabled = true

[server]
host = 0.0.0.0
port = 8080
debug_mode = false
log_level = info
max_workers = 8

[network]
timeout = 60
retry_count = 3
proxy_enabled = yes
buffer_size = 1024

[paths]
log_dir = "/var/log/myapp"
data_dir = /opt/data
temp_dir = "C:\Temp\myapp"

[empty_section]

[special_cases]
empty_value =
spaces     =   hello world
mixed_spaces =  test   value
only_equals = ===
comment_after_value = actual_value  # comment
quoted_with_spaces = "  quoted value  "
single_quoted = 'single quoted'

[client_actor]
address = "123.57.86.15"
port = 8901
heartbeat_interval = 5000
